# Ventaura Reverse Proxy Configuration with SSL
# Place this file in: /etc/nginx/sites-available/ventaura
# Then symlink to: /etc/nginx/sites-enabled/ventaura

upstream frontend {
    server localhost:3000;
}

upstream backend {
    server localhost:5152;
}

upstream ranking {
    server localhost:8000;
}

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    server_name ventaura.co www.ventaura.co;
    
    # Allow certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Main server (www and non-www)
server {
    listen 443 ssl http2;
    server_name ventaura.co www.ventaura.co;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/ventaura.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ventaura.co/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Increase buffer sizes for large requests
    client_max_body_size 50M;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # Logging
    access_log /var/log/nginx/ventaura-access.log;
    error_log /var/log/nginx/ventaura-error.log;

    # API endpoints - route to backend
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Ranking service - route to Python FastAPI
    location /rank-events/ {
        proxy_pass http://ranking/rank-events/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Test endpoints for ranking service
    location /test {
        proxy_pass http://ranking/test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend - route everything else to React app
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
